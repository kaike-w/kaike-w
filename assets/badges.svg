      <circle cx="12" cy="8.6" r="1.7"/>
      <path d="M7.7 12.4 5.2 14.6M16.3 12.4l2.5 2.2"/>
      <path d="M10.4 17.6c.4 1.3 1 2.4 1.6 3.2.6-.8 1.2-1.9 1.6-3.2"/>

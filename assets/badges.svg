<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" fill="none" role="img" aria-label="achievement wall">
  <defs>
    <linearGradient id="a1" x1="20" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.95"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="a2" x1="195" y1="0" x2="355" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.95"/><stop offset="1" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="a3" x1="370" y1="0" x2="530" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.95"/><stop offset="1" stop-color="#A855F7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="a4" x1="545" y1="0" x2="705" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.95"/><stop offset="1" stop-color="#F472B6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="a5" x1="720" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.95"/><stop offset="1" stop-color="#34D399" stop-opacity="0.2"/>
    </linearGradient>
    <style>
      @keyframes bob { 0%{transform:translateY(0)} 50%{transform:translateY(-3px)} 100%{transform:translateY(0)} }
      .t1{animation:bob 4s ease-in-out infinite}
      .t2{animation:bob 4s ease-in-out .5s infinite}
      .t3{animation:bob 4s ease-in-out 1s infinite}
      .t4{animation:bob 4s ease-in-out 1.5s infinite}
      .t5{animation:bob 4s ease-in-out 2s infinite}
      .lbl{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;font-size:15px;fill:#9FB2D4;text-anchor:middle}
      .ic{fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <g class="t1">
    <rect x="20" y="14" width="160" height="120" rx="14" fill="#0B1220" stroke="url(#a1)" stroke-width="1.5"/>
    <g class="ic" stroke="#22D3EE" transform="translate(81 32) scale(1.6)">
      <path d="M6.5 9.5h9v5.6a4.5 4.5 0 0 1-9 0V9.5z"/>
      <path d="M15.5 10.6h1.2a2.6 2.6 0 0 1 0 5.2h-1.2"/>
      <path d="M8.8 6.4c0-1 .8-1.3.8-2.1M12.2 6.4c0-1 .8-1.3.8-2.1"/>
    </g>
    <text class="lbl" x="100" y="110">咖啡续命</text>
  </g>

  <g class="t2">
    <rect x="195" y="14" width="160" height="120" rx="14" fill="#0B1220" stroke="url(#a2)" stroke-width="1.5"/>
    <g class="ic" stroke="#818CF8" transform="translate(256 32) scale(1.6)">
      <ellipse cx="12" cy="13" rx="5.2" ry="5.8"/>
      <path d="M9.4 7.6c0-1.6 1.2-2.8 2.6-2.8s2.6 1.2 2.6 2.8"/>
      <path d="M9.6 5.6 8.2 3.9M14.4 5.6l1.4-1.7"/>
      <path d="M7.2 11.4 4.8 10.2M6.9 14.4H4.2M7.4 17.2 5 18.6M16.8 11.4l2.4-1.2M17.1 14.4h2.7M16.6 17.2l2.4 1.4"/>
    </g>
    <text class="lbl" x="275" y="110">bug 饲养员</text>
  </g>

  <g class="t3">
    <rect x="370" y="14" width="160" height="120" rx="14" fill="#0B1220" stroke="url(#a3)" stroke-width="1.5"/>
    <g class="ic" stroke="#A855F7" transform="translate(431 32) scale(1.6)">
      <path d="M15.3 3.6a8.4 8.4 0 1 0 5.1 13.6A6.8 6.8 0 0 1 15.3 3.6z"/>
      <path d="M20.4 4.2h.01M18.6 7.6h.01M3.6 9.4h.01"/>
    </g>
    <text class="lbl" x="450" y="110">夜猫子</text>
  </g>

  <g class="t4">
    <rect x="545" y="14" width="160" height="120" rx="14" fill="#0B1220" stroke="url(#a4)" stroke-width="1.5"/>
    <g class="ic" stroke="#F472B6" transform="translate(606 32) scale(1.6)">
      <rect x="2.8" y="8" width="18.4" height="10" rx="2.2"/>
      <path d="M6.4 11.4h.01M9.4 11.4h.01M12.4 11.4h.01M15.4 11.4h.01M18 11.4h.01M6.4 14.4h.01M9.4 14.4h.01M12.4 14.4h.01M15.4 14.4h.01M18 14.4h.01"/>
    </g>
    <text class="lbl" x="625" y="110">Ctrl+S 强迫症</text>
  </g>

  <g class="t5">
    <rect x="720" y="14" width="160" height="120" rx="14" fill="#0B1220" stroke="url(#a5)" stroke-width="1.5"/>
    <g class="ic" stroke="#34D399" transform="translate(781 32) scale(1.6)">
      <path d="M12 2.6c3.2 2 4.8 5 4.8 8.1L12 16.4 7.2 10.7c0-3.1 1.6-6.1 4.8-8.1z"/>
      <circle cx="12" cy="8.6" r="1.7"/>
      <path d="M7.7 12.4 5.2 14.6M16.3 12.4l2.5 2.2"/>
      <path d="M10.4 17.6c.4 1.3 1 2.4 1.6 3.2.6-.8 1.2-1.9 1.6-3.2"/>
    </g>
    <text class="lbl" x="800" y="110">能跑就行</text>
  </g>
</svg>

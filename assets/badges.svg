<svg xmlns="http://www.w3.org/2000/svg" width="900" height="146" viewBox="0 0 900 146" fill="none" role="img" aria-label="achievement wall">
  <defs>
    <style>
      @keyframes bob { 0%{transform:translateY(0)} 50%{transform:translateY(-2.5px)} 100%{transform:translateY(0)} }
      .t1{animation:bob 5s ease-in-out infinite}
      .t2{animation:bob 5s ease-in-out .6s infinite}
      .t3{animation:bob 5s ease-in-out 1.2s infinite}
      .t4{animation:bob 5s ease-in-out 1.8s infinite}
      .t5{animation:bob 5s ease-in-out 2.4s infinite}
      .lbl{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;font-size:14px;fill:#6B7280;text-anchor:middle}
      .ic{fill:none;stroke:#475569;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <g class="t1">
    <rect x="20.5" y="12.5" width="159" height="119" rx="14" fill="#FFFFFF" stroke="#EAECEF"/>
    <g class="ic" transform="translate(81 30) scale(1.6)">
      <path d="M6.5 9.5h9v5.6a4.5 4.5 0 0 1-9 0V9.5z"/>
      <path d="M15.5 10.6h1.2a2.6 2.6 0 0 1 0 5.2h-1.2"/>
      <path d="M8.8 6.4c0-1 .8-1.3.8-2.1M12.2 6.4c0-1 .8-1.3.8-2.1"/>
    </g>
    <text class="lbl" x="100" y="108">咖啡续命</text>
  </g>

  <g class="t2">
    <rect x="195.5" y="12.5" width="159" height="119" rx="14" fill="#FFFFFF" stroke="#EAECEF"/>
    <g class="ic" transform="translate(256 30) scale(1.6)">
      <ellipse cx="12" cy="13" rx="5.2" ry="5.8"/>
      <path d="M9.4 7.6c0-1.6 1.2-2.8 2.6-2.8s2.6 1.2 2.6 2.8"/>
      <path d="M9.6 5.6 8.2 3.9M14.4 5.6l1.4-1.7"/>
      <path d="M7.2 11.4 4.8 10.2M6.9 14.4H4.2M7.4 17.2 5 18.6M16.8 11.4l2.4-1.2M17.1 14.4h2.7M16.6 17.2l2.4 1.4"/>
    </g>
    <text class="lbl" x="275" y="108">bug 饲养员</text>
  </g>

  <g class="t3">
    <rect x="370.5" y="12.5" width="159" height="119" rx="14" fill="#FFFFFF" stroke="#EAECEF"/>
    <g class="ic" transform="translate(431 30) scale(1.6)">
      <path d="M15.3 3.6a8.4 8.4 0 1 0 5.1 13.6A6.8 6.8 0 0 1 15.3 3.6z"/>
      <path d="M20.4 4.2h.01M18.6 7.6h.01M3.6 9.4h.01"/>
    </g>
    <text class="lbl" x="450" y="108">夜猫子</text>
  </g>

  <g class="t4">
    <rect x="545.5" y="12.5" width="159" height="119" rx="14" fill="#FFFFFF" stroke="#EAECEF"/>
    <g class="ic" transform="translate(606 30) scale(1.6)">
      <rect x="2.8" y="8" width="18.4" height="10" rx="2.2"/>
      <path d="M6.4 11.4h.01M9.4 11.4h.01M12.4 11.4h.01M15.4 11.4h.01M18 11.4h.01M6.4 14.4h.01M9.4 14.4h.01M12.4 14.4h.01M15.4 14.4h.01M18 14.4h.01"/>
    </g>
    <text class="lbl" x="625" y="108">Ctrl+S 强迫症</text>
  </g>


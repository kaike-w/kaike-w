<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none" role="img" aria-label="kaike-w — Data Analysis, Web, Java">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.5" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="96" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.45" stop-color="#818CF8"/>
      <stop offset="0.7" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientTransform="translate(150 40) rotate(40) scale(360 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientTransform="translate(1130 320) rotate(-35) scale(420 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0" cy="0" r="1" gradientTransform="translate(760 30) rotate(60) scale(300 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#8FA8D8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="nameClip">
      <text x="96" y="196" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif" font-size="88" font-weight="700" letter-spacing="-1">kaike-w</text>
    </clipPath>
    <style>
      @keyframes driftA { 0%{transform:translate(0,0)} 50%{transform:translate(26px,-14px)} 100%{transform:translate(0,0)} }
      @keyframes driftB { 0%{transform:translate(0,0)} 50%{transform:translate(-30px,12px)} 100%{transform:translate(0,0)} }
      @keyframes slide { 0%{transform:translateX(-460px)} 55%{transform:translateX(980px)} 100%{transform:translateX(980px)} }
      @keyframes blink { 0%,45%{opacity:1} 55%,100%{opacity:0} }
      @keyframes pulse { 0%{opacity:.55} 50%{opacity:1} 100%{opacity:.55} }
      .a{animation:driftA 11s ease-in-out infinite}
      .b{animation:driftB 14s ease-in-out infinite}
      .sweep{animation:slide 7s ease-in-out infinite}
      .cursor{animation:blink 1.2s steps(1) infinite}
      .dot{animation:pulse 3s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <g class="a"><rect width="1280" height="340" fill="url(#glowCyan)"/></g>
  <g class="b"><rect width="1280" height="340" fill="url(#glowViolet)"/></g>
  <rect width="1280" height="340" fill="url(#glowPink)"/>

  <!-- decorative rings -->
  <g opacity="0.5" stroke="url(#accent)" fill="none">
    <circle cx="1090" cy="150" r="118" stroke-opacity="0.18"/>
    <circle cx="1090" cy="150" r="86" stroke-opacity="0.26"/>
    <circle cx="1090" cy="150" r="54" stroke-opacity="0.38"/>
  </g>
  <text x="1064" y="176" font-family="'Fira Code','Cascadia Code',Consolas,monospace" font-size="46" fill="#22D3EE" fill-opacity="0.55">&lt;/&gt;</text>
  <circle class="dot" cx="1090" cy="20" r="4" fill="#22D3EE" fill-opacity="0.7"/>

  <!-- eyebrow -->
  <text x="98" y="104" font-family="'Fira Code','Cascadia Code',Consolas,monospace" font-size="17" letter-spacing="5" fill="#22D3EE" fill-opacity="0.85">// HELLO WORLD</text>

  <!-- name -->
  <text x="96" y="196" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif" font-size="88" font-weight="700" letter-spacing="-1" fill="url(#accent)">kaike-w</text>
  <g clip-path="url(#nameClip)"><rect class="sweep" x="0" y="120" width="160" height="90" fill="url(#sweep)" opacity="0.25"/></g>

  <!-- tagline -->
  <text x="98" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="22" letter-spacing="5" fill="#9FB2D4">BUILD · BREAK · REPEAT</text>
  <rect x="470" y="229" width="13" height="24" rx="2" fill="#818CF8" class="cursor"/>

  <!-- divider bar -->
  <rect x="96" y="284" width="230" height="4" rx="2" fill="url(#accent)"/>

  <!-- footer meta -->
  <text x="96" y="318" font-family="'Fira Code','Cascadia Code',Consolas,monospace" font-size="15" letter-spacing="2" fill="#6B7C9B">github.com/kaike-w</text>
  <g fill="#6B7C9B" font-family="'Fira Code',Consolas,monospace" font-size="15" letter-spacing="2">
    <text x="1120" y="318" text-anchor="end">EST. 2022 · KEEP BUILDING</text>
  </g>
</svg>

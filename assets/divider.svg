<svg xmlns="http://www.w3.org/2000/svg" width="800" height="40" viewBox="0 0 800 40" fill="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="l" x1="0" y1="20" x2="360" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="r" x1="440" y1="20" x2="800" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.85"/>

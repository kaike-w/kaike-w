  <rect x="0" y="19" width="360" height="2" fill="url(#l)"/>
  <rect x="440" y="19" width="360" height="2" fill="url(#r)"/>
  <g class="g">
    <rect x="391" y="11" width="18" height="18" rx="3" transform="rotate(45 400 20)" fill="url(#d)"/>
  </g>
  <circle cx="372" cy="20" r="2.5" fill="#22D3EE" fill-opacity="0.7"/>
  <circle cx="428" cy="20" r="2.5" fill="#F472B6" fill-opacity="0.7"/>

<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" fill="none" role="img" aria-label="terminal card">
  <defs>
    <clipPath id="l1"><rect x="34" y="84" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="0.9s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="34" y="128" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="1.1s" begin="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="34" y="172" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="1.3s" begin="2.5s" fill="freeze"/></rect></clipPath>
    <style>@keyframes bl{0%,50%{opacity:1}51%,100%{opacity:0}}.cur{animation:bl 1.1s steps(1) infinite}</style>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="229" rx="14" fill="#FFFFFF" stroke="#EAECEF"/>
  <path d="M0.5 44.5H819.5" stroke="#F0F1F4"/>
  <circle cx="26" cy="23" r="5" fill="#E5E7EB"/>
  <circle cx="44" cy="23" r="5" fill="#E5E7EB"/>
  <circle cx="62" cy="23" r="5" fill="#E5E7EB"/>
  <text x="410" y="28" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="12" letter-spacing="1" fill="#B6BBC4">kaike-w ~ zsh</text>

  <g clip-path="url(#l1)" font-family="'Fira Code',Consolas,monospace" font-size="16">
    <text x="34" y="104" fill="#2563EB">$ whoami</text>
    <text x="250" y="104" fill="#111827">kaike-w</text>
    <text x="430" y="104" fill="#B6BBC4" font-size="13">// 一个还在学新东西的人</text>
  </g>
  <g clip-path="url(#l2)" font-family="'Fira Code',Consolas,monospace" font-size="16">
    <text x="34" y="148" fill="#2563EB">$ cat status.txt</text>
    <text x="250" y="148" fill="#111827">摸鱼中，有事烧纸</text>
    <text x="430" y="148" fill="#B6BBC4" font-size="13">// 但会回消息</text>
  </g>
  <g clip-path="url(#l3)" font-family="'Fira Code',Consolas,monospace" font-size="16">
    <text x="34" y="192" fill="#2563EB">$ sudo make me happy</text>
    <text x="250" y="192" fill="#16A34A">[ok] 已满足</text>
    <text x="430" y="192" fill="#B6BBC4" font-size="13">// 一行命令治愈</text>
  </g>
  <rect class="cur" x="34" y="206" width="9" height="16" rx="1" fill="#2563EB"/>
</svg>

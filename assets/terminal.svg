<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240" fill="none" role="img" aria-label="terminal card">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="820" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#121A2E"/>
    </linearGradient>
    <linearGradient id="tstroke" x1="0" y1="0" x2="820" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#818CF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="l1"><rect x="34" y="86" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="0.9s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="34" y="130" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="1.1s" begin="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="34" y="174" width="0" height="26"><animate attributeName="width" from="0" to="760" dur="1.3s" begin="2.5s" fill="freeze"/></rect></clipPath>
    <style>
      @keyframes blinkc { 0%,50%{opacity:1} 51%,100%{opacity:0} }
      .cur{animation:blinkc 1.1s steps(1) infinite}
      @keyframes glowp { 0%{opacity:.35} 50%{opacity:.9} 100%{opacity:.35} }
      .d{animation:glowp 3.4s ease-in-out infinite}
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="818.5" height="238.5" rx="14" fill="url(#tbg)" stroke="url(#tstroke)" stroke-width="1.5"/>
  <path d="M0.75 44.75H819.25" stroke="#1E2A44" stroke-width="1"/>
  <circle cx="26" cy="23" r="5.5" fill="#FF5F57" fill-opacity="0.85"/>
  <circle cx="46" cy="23" r="5.5" fill="#FEBC2E" fill-opacity="0.85"/>
  <circle cx="66" cy="23" r="5.5" fill="#28C840" fill-opacity="0.85"/>
  <text x="410" y="28" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="13" letter-spacing="1" fill="#6B7C9B">kaike-w ~ zsh</text>

  <g clip-path="url(#l1)" font-family="'Fira Code',Consolas,monospace" font-size="17">
    <text x="34" y="106" fill="#22D3EE">$ whoami</text>
    <text x="250" y="106" fill="#C9D6EE">kaike-w</text>
    <text x="430" y="106" fill="#6B7C9B" font-size="14">// 一个还在瞎折腾的人</text>
  </g>
  <g clip-path="url(#l2)" font-family="'Fira Code',Consolas,monospace" font-size="17">
    <text x="34" y="150" fill="#22D3EE">$ cat status.txt</text>
    <text x="250" y="150" fill="#C9D6EE">摸鱼中，有事烧纸</text>
    <text x="430" y="150" fill="#6B7C9B" font-size="14">// 但会回消息</text>
  </g>
  <g clip-path="url(#l3)" font-family="'Fira Code',Consolas,monospace" font-size="17">
    <text x="34" y="194" fill="#22D3EE">$ sudo make me happy</text>
    <text x="250" y="194" fill="#28C840">[ok] 已满足</text>
    <text x="430" y="194" fill="#6B7C9B" font-size="14">// 一行命令治愈</text>
  </g>
  <rect class="cur" x="34" y="212" width="10" height="18" rx="2" fill="#22D3EE"/>
  <circle class="d" cx="784" cy="212" r="4" fill="#F472B6"/>
</svg>

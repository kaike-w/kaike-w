<svg xmlns="http://www.w3.org/2000/svg" width="260" height="150" viewBox="0 0 260 150" fill="none" role="img" aria-label="sleeping cat">
  <defs>
    <style>
      @keyframes breathe { 0%{transform:scale(1,1)} 50%{transform:scale(1.03,0.975)} 100%{transform:scale(1,1)} }
      @keyframes tail { 0%{transform:rotate(0)} 50%{transform:rotate(8deg)} 100%{transform:rotate(0)} }
      @keyframes floatz { 0%{opacity:0;transform:translate(0,5px)} 30%{opacity:1} 100%{opacity:0;transform:translate(8px,-22px)} }
      .body{animation:breathe 4.6s ease-in-out infinite;transform-origin:132px 124px}
      .tail{animation:tail 3.4s ease-in-out infinite;transform-origin:184px 116px}
      .z1{animation:floatz 4.6s ease-in-out infinite}
      .z2{animation:floatz 4.6s ease-in-out .95s infinite}
      .z3{animation:floatz 4.6s ease-in-out 1.9s infinite}
    </style>
  </defs>

  <ellipse cx="132" cy="130" rx="58" ry="5" fill="#F1F3F5"/>

  <g class="tail">
    <path d="M180 118c14-1 21-9 21-19" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <g class="body">
    <path d="M80 127c0-21 19-33 52-33s52 12 52 33z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="104" cy="90" r="25" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
    <path d="M86 73l-3-15 15 8z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M122 73l3-15-15 8z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M93 90q5 5 10 0" stroke="#475569" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M107 90q5 5 10 0" stroke="#475569" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M103 97h3l-1.5 2z" fill="#F472B6"/>
    <path d="M87 98l-8-2M87 102l-8 2M120 98l8-2M120 102l8 2" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g font-family="'Fira Code',Consolas,monospace" font-weight="600" fill="#CBD5E1">
    <text class="z1" x="146" y="74" font-size="15">z</text>
    <text class="z2" x="157" y="62" font-size="19">Z</text>
    <text class="z3" x="170" y="50" font-size="22">z</text>
  </g>
</svg>

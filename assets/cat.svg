<svg xmlns="http://www.w3.org/2000/svg" width="260" height="150" viewBox="0 0 260 150" fill="none" role="img" aria-label="sleeping cat">
  <defs>
    <linearGradient id="cb" x1="70" y1="70" x2="190" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="cg" cx="0" cy="0" r="1" gradientTransform="translate(130 115) rotate(90) scale(70 90)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes breathe { 0%{transform:scale(1,1)} 50%{transform:scale(1.035,0.97)} 100%{transform:scale(1,1)} }
      @keyframes tailwag { 0%{transform:rotate(0deg)} 50%{transform:rotate(9deg)} 100%{transform:rotate(0deg)} }
      @keyframes floatz { 0%{opacity:0;transform:translate(0,6px)} 30%{opacity:.95} 100%{opacity:0;transform:translate(10px,-26px)} }
      @keyframes blink { 0%,88%,100%{transform:scaleY(1)} 92%,96%{transform:scaleY(0.08)} }
      .body{animation:breathe 4.2s ease-in-out infinite;transform-origin:130px 126px}
      .tail{animation:tailwag 3.2s ease-in-out infinite;transform-origin:186px 118px}
      .eye{animation:blink 6s ease-in-out infinite;transform-origin:center}
      .z1{animation:floatz 4.5s ease-in-out infinite}
      .z2{animation:floatz 4.5s ease-in-out .9s infinite}
      .z3{animation:floatz 4.5s ease-in-out 1.8s infinite}
    </style>
  </defs>

  <rect width="260" height="150" fill="url(#cg)"/>
  <ellipse cx="132" cy="132" rx="66" ry="6" fill="#0B1220" fill-opacity="0.55"/>

  <g class="tail">
    <path d="M182 120c14-2 22-10 22-20" stroke="url(#cb)" stroke-width="7" stroke-linecap="round" fill="none" stroke-opacity="0.9"/>
  </g>

  <g class="body">
    <!-- body -->
    <path d="M78 128c0-22 20-34 52-34s52 12 52 34z" fill="url(#cb)" fill-opacity="0.95"/>
    <path d="M78 128c0-22 20-34 52-34s52 12 52 34z" fill="#0B1220" fill-opacity="0.18"/>
    <!-- head -->
    <circle cx="104" cy="92" r="26" fill="url(#cb)"/>
    <!-- ears -->
    <path d="M86 74l-4-16 16 8z" fill="#22D3EE"/>
    <path d="M122 74l4-16-16 8z" fill="#22D3EE"/>
    <path d="M88 73l-2-9 9 4z" fill="#0B1220" fill-opacity="0.35"/>
    <path d="M120 73l2-9-9 4z" fill="#0B1220" fill-opacity="0.35"/>
    <!-- closed eyes -->
    <g class="eye">
      <path d="M93 92q5 5 10 0" stroke="#08101D" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M107 92q5 5 10 0" stroke="#08101D" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    </g>
    <!-- nose + whiskers -->
    <path d="M103 99h3l-1.5 2z" fill="#F472B6"/>
    <path d="M86 99l-9-2M86 103l-9 2M121 99l9-2M121 103l9 2" stroke="#0B1220" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round"/>
    <!-- paws -->
    <ellipse cx="98" cy="128" rx="10" ry="4.5" fill="#E6F7FF" fill-opacity="0.85"/>
    <ellipse cx="124" cy="128" rx="10" ry="4.5" fill="#E6F7FF" fill-opacity="0.85"/>
  </g>

  <g font-family="'Fira Code',Consolas,monospace" font-weight="700" fill="#22D3EE">
    <text class="z1" x="146" y="76" font-size="16">z</text>
    <text class="z2" x="158" y="64" font-size="20">Z</text>
    <text class="z3" x="172" y="52" font-size="24">z</text>
  </g>
</svg>

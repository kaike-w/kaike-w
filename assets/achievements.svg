<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" fill="none" role="img" aria-label="achievement wall">
  <defs>
    <linearGradient id="a1" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.9"/><stop offset="1" stop-color="#818CF8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.9"/><stop offset="1" stop-color="#A855F7" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="a4" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.9"/><stop offset="1" stop-color="#F472B6" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="a5" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.9"/><stop offset="1" stop-color="#34D399" stop-opacity="0.25"/>
    </linearGradient>
    <style>
      @keyframes bob { 0%{transform:translateY(0)} 50%{transform:translateY(-3px)} 100%{transform:translateY(0)} }
      .t1{animation:bob 4s ease-in-out infinite}
      .t2{animation:bob 4s ease-in-out .5s infinite}
      .t3{animation:bob 4s ease-in-out 1s infinite}
      .t4{animation:bob 4s ease-in-out 1.5s infinite}
      .t5{animation:bob 4s ease-in-out 2s infinite}
      .lbl{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;font-size:14px;fill:#9FB2D4;text-anchor:middle}
      .ico{font-family:'Segoe UI Emoji','Apple Color Emoji',sans-serif;font-size:32px;text-anchor:middle}
    </style>
  </defs>

  <g class="t1">
    <rect x="20" y="14" width="160" height="120" rx="14" fill="#0B1220" stroke="url(#a1)" stroke-width="1.5"/>
    <text class="ico" x="100" y="72">☕</text>
    <text class="lbl" x="100" y="108">咖啡续命</text>
  </g>
  <g class="t2">
    <rect x="195" y="14" width="160" height="120" rx="14" fill="#0B1220" stroke="url(#a2)" stroke-width="1.5"/>
    <text class="ico" x="275" y="72">🐛</text>
    <text class="lbl" x="275" y="108">bug 饲养员</text>
  </g>
  <g class="t3">
    <rect x="370" y="14" width="160" height="120" rx="14" fill="#0B1220" stroke="url(#a3)" stroke-width="1.5"/>
    <text class="ico" x="450" y="72">🌙</text>
    <text class="lbl" x="450" y="108">夜猫子</text>
  </g>
  <g class="t4">
    <rect x="545" y="14" width="160" height="120" rx="14" fill="#0B1220" stroke="url(#a4)" stroke-width="1.5"/>
    <text class="ico" x="625" y="72">⌨️</text>
    <text class="lbl" x="625" y="108">Ctrl+S 强迫症</text>
  </g>
  <g class="t5">
    <rect x="720" y="14" width="160" height="120" rx="14" fill="#0B1220" stroke="url(#a5)" stroke-width="1.5"/>
    <text class="ico" x="800" y="72">🚀</text>
    <text class="lbl" x="800" y="108">能跑就行</text>
  </g>
</svg>
